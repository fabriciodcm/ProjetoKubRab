x-worker-base: &worker-base
  build:
    context: ./src/ProjectKubRab/ProjectKubRab.Worker
    dockerfile: Dockerfile
  depends_on:
    dotnetproductspage:
      condition: service_started
    api:
      condition: service_started
    rabbitmq:
      condition: service_healthy
  environment:
    - RabbitMQ__HostName=rabbitmq
    - RabbitMQ__Port=5672
    - RabbitMQ__UserName=app
    - RabbitMQ__Password=app123
    - ProductApi__BaseUrl=http://dotnetproductspage:8080
  networks:
    - public-network

services:
  mongodb:
    image: mongo:8.3.7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongodb/data/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root1234
    networks:
      - public-network
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - public-network
  dotnetproductspage:
    build:
      context: ./src/ProjectKubRab/ProjectKubRab.ProductsWebApp
      dockerfile: Dockerfile
    ports:
      - "8585:8080"
    networks:
      - public-network
  api:
    build:
      context: ./src/ProjectKubRab/ProjectKubRab.API
      dockerfile: Dockerfile
    ports:
      - "8181:8080"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      - MongoDB__ConnectionString=mongodb://root:root1234@mongodb:27017/?authSource=admin
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=app
      - RabbitMQ__Password=app123
    networks:
      - public-network

  #productspage:
  #  image: nginx:alpine
