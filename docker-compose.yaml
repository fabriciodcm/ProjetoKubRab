x-worker-base: &worker-base
  build:
    context: ./src/ProjectKubRab
    dockerfile: ProjectKubRab.Worker/Dockerfile
    args:
      BUILD_CONFIGURATION: Release
  depends_on:
    - dotnetproductspage
    - api
    - rabbitmq
  networks:
    - public-network

services:
  mongodb:
    image: mongo:8.3.7
    #container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongodb/data/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - public-network
  rabbitmq:
    image: rabbitmq:3-management
    #container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - public-network
  productspage:
    image: nginx:alpine
    ports:
      - "8181:80"
    volumes:
      - ./docker/productspage/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - public-network
  reactproductspage:
    build:
      context: ./src/ProjectKubRab/ProjectKubRab.ProductsWebApp
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - public-network
  dotnetproductspage:
    build:
      context: ./src/ProjectKubRab/ProjectKubRab.ProductsWebApp
      dockerfile: Dockerfile
    ports:
      - "8585:8080"
    networks:
      - public-network
  api:
    build:
      context: ./src/ProjectKubRab
      dockerfile: ProjectKubRab.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      - MongoDB__ConnectionString=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
    networks:
      - public-network
  worker-1:
    <<: *worker-base
    command: ["MSI RTX 5060 Ti Ventus 2X OC Plus"]
  worker-2:
    <<: *worker-base
    command: ["MSI GeForce RTX 5070 12G VENTUS 2X OC"]
  worker-3:
    <<: *worker-base
    command: ["ASRock RX 9060 XT CL 16GB AMD Radeon"]
  worker-4:
    <<: *worker-base
    command: ["ASRock RX 9070 XT Challenger AMD 16GB"]
  worker-5:
    <<: *worker-base
    command: ["Asus TUF-RTX 5070 TI 16G GAMING 16GB"]
networks:
  public-network:
    driver: bridge
