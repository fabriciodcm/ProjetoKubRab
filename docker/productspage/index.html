<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Produtos - GPUs</title>
	<style>
		:root {
			--bg: #f5f5f5;
			--card: #ffffff;
			--text: #1f2937;
			--muted: #6b7280;
			--border: #e5e7eb;
			--accent: #111827;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.container {
			width: 100%;
			max-width: 760px;
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
		}

		h1 {
			margin: 0 0 8px;
			font-size: 1.4rem;
			color: var(--accent);
		}

		p {
			margin: 0 0 18px;
			color: var(--muted);
			font-size: 0.95rem;
		}

		ul {
			list-style: none;
			margin: 0;
			padding: 0;
			display: grid;
			gap: 10px;
		}

		li {
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 12px 14px;
			display: flex;
			justify-content: space-between;
			gap: 10px;
			align-items: center;
			background: #fff;
		}

		.name {
			font-size: 0.95rem;
		}

		.price {
			font-weight: 700;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<main class="container">
		<h1>Lista de Produtos</h1>
		<p>Precos com variacao aleatoria entre -7% e +7% sobre o valor base.</p>
		<ul id="products-list"></ul>
	</main>

	<script>
		const products = [
			{ name: "MSI RTX 5060 Ti Ventus 2X OC Plus", basePrice: 2699.99 },
			{ name: "MSI GeForce RTX 5070 12G VENTUS 2X OC", basePrice: 4399.99 },
			{ name: "ASRock RX 9060 XT CL 16GB AMD Radeon", basePrice: 2799.99 },
			{ name: "ASRock RX 9070 XT Challenger AMD 16GB", basePrice: 4299.99 },
			{ name: "Asus TUF-RTX 5070 TI 16G GAMING 16GB", basePrice: 9226.0 }
		];

		const formatter = new Intl.NumberFormat("pt-BR", {
			style: "currency",
			currency: "BRL"
		});

		function randomVariation(minPercent, maxPercent) {
			return Math.random() * (maxPercent - minPercent) + minPercent;
		}

		function applyRandomPrice(basePrice) {
			const variation = randomVariation(-0.07, 0.07);
			return basePrice * (1 + variation);
		}

		function renderProducts() {
			const list = document.getElementById("products-list");

			products.forEach((product) => {
				const finalPrice = applyRandomPrice(product.basePrice);

				const item = document.createElement("li");

				const name = document.createElement("span");
				name.className = "name";
				name.textContent = product.name;

				const price = document.createElement("span");
				price.className = "price";
				price.textContent = formatter.format(finalPrice);

				item.appendChild(name);
				item.appendChild(price);
				list.appendChild(item);
			});
		}

		renderProducts();
	</script>
</body>
</html>
