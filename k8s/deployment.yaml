                - until nc -z rabbitmq 5672 && nc -z dotnetproductspage 8080 && nc -z api 8080; do echo "Aguardando RabbitMQ, página de produtos e API"; sleep 2; done
          containers:
            - name: worker
              image: projectkubrab-worker:latest
              imagePullPolicy: IfNotPresent
